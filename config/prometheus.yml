global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'spring-actuator'
    scrape_interval: 5s
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8080']

  - job_name: 'kafka'
    static_configs:
      - targets: [ 'kafka-exporter:9308' ]
    scrape_interval: 10s